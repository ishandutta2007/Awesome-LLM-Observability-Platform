<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b112c"/>
      <stop offset="100%" stop-color="#050714"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 48px; letter-spacing: 2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 1.5px; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 600; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="360" fill="url(#cyberGrid)" rx="16"/>

  <!-- Glowing Radar / Pulse Centers -->
  <g transform="translate(1050, 180)">
    <circle r="20" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="10;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="10;120" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>

  <g transform="translate(150, 180)">
    <circle r="15" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7">
      <animate attributeName="r" values="5;90" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#a855f7" filter="url(#softGlow)"/>
  </g>

  <!-- Animated Data Streams / Tracing Waveforms -->
  <path d="M 50,90 Q 250,150 450,70 T 850,110 T 1150,80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;100" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M 50,270 Q 300,200 600,290 T 950,230 T 1150,280" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="100;0" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Central Content Box -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Main Title with Glow -->
    <text y="0" class="title" fill="url(#textGrad)" filter="url(#glow)">AWESOME LLM OBSERVABILITY</text>
    <text y="0" class="title" fill="url(#textGrad)">AWESOME LLM OBSERVABILITY</text>

    <!-- Divider Bar -->
    <rect x="-350" y="24" width="700" height="2" fill="url(#glowLine)" rx="1"/>

    <!-- Subtitle -->
    <text y="62" class="subtitle">Curated Ecosystem for Tracing, Evals, Prompt Ops &amp; Agent Monitoring</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 115)">
      <!-- Badge 1: Tracing -->
      <g transform="translate(-270, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
        <text y="5" class="tag" fill="#38bdf8" text-anchor="middle">⚡ Tracing &amp; Logs</text>
      </g>
      <!-- Badge 2: Evals -->
      <g transform="translate(-90, 0)">
        <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
        <text y="5" class="tag" fill="#818cf8" text-anchor="middle">🧪 LLM Evals</text>
      </g>
      <!-- Badge 3: Prompt Ops -->
      <g transform="translate(90, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.9"/>
        <text y="5" class="tag" fill="#c084fc" text-anchor="middle">📝 Prompt Ops</text>
      </g>
      <!-- Badge 4: Guardrails -->
      <g transform="translate(270, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.9"/>
        <text y="5" class="tag" fill="#34d399" text-anchor="middle">🛡️ Guardrails</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.7"/>
</svg>